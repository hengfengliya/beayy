# Beayy（Be Authentic. Your Yesterdays.）Rust workspace。结构见 报告/方案_20261015_Rust与Tauri迁移.md
[workspace]
resolver = "2"
members = ["crates/beayy-core", "crates/beayy-phone", "crates/beayy-capture", "crates/beayy-summary", "crates/beayy-sync", "crates/beayy-remote", "crates/beayy-install", "src-tauri", "setup", "mobile"]

[workspace.package]
version = "0.2.50"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
beayy-core = { path = "crates/beayy-core" }
beayy-phone = { path = "crates/beayy-phone" }
beayy-capture = { path = "crates/beayy-capture" }
beayy-summary = { path = "crates/beayy-summary" }
beayy-sync = { path = "crates/beayy-sync" }
beayy-remote = { path = "crates/beayy-remote" }
beayy-install = { path = "crates/beayy-install" }

[profile.release]
lto = "thin"
strip = true
