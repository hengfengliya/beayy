[package]
name = "beayy"
description = "Beayy（Be Authentic. Your Yesterdays.）Tauri 2 外壳：菜单栏、主窗口、给网页的命令、定时任务"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
beayy-core.workspace = true
beayy-phone.workspace = true
beayy-capture.workspace = true
beayy-summary.workspace = true
beayy-sync.workspace = true
beayy-remote.workspace = true
regex = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
# 收支：读微信的 xlsx 账单、支付宝的 GBK csv（bills.rs）
calamine = { version = "0.38", default-features = false, features = ["chrono"] }
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# 设置里列系统字体（fonts.rs，GDI 枚举）；和 beayy-capture 同一版本
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
beayy-install.workspace = true
